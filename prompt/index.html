        // Generator Prompt Lokal Berdasarkan 5 Unsur Nano Banana
        function generateLocalPrompts({ subjectType, purpose, selectedCategories, mode, count, customMood }) {
            const results = [];
            
            // Subjek Deskriptif
            const subjectsMap = {
                'orang': [
                    'wanita muda berhijab dengan ekspresi senyum santai dan percaya diri',
                    'pria muda Asia berpakaian kemeja linen casual dengan tatapan hangat',
                    'model wanita profesional berpakaian blazer modern dengan pose berdiri elegan',
                    'pria dewasa bergaya streetwear trendi dengan postur tubuh santai',
                    'wanita muda berwajah segar tanpa makeup tebal dengan senyum alami'
                ],
                'produk': [
                    'botol skincare kaca premium transparan dengan label minimalis',
                    'sepatu sneakers edisi terbatas berdesain futuristik dan bersih',
                    'jam tangan kemewahan dengan tali kulit asli dan aksen logam emas',
                    'tas tangan wanita berbahan kulit sintetis warna nude yang elegan',
                    'kemasan minuman kopi dingin dalam kaleng estetis berembun'
                ],
                'makanan': [
                    'piring gourmet berisi hidangan pasta krim bertabur keju parmesan dan peterseli segar',
                    'cangkir kopi porselen putih berisi latte art angsa yang sempurna',
                    'burger keju berlapis daging juicy, selada segar, dan lelehan keju cheddar',
                    'mangkuk smoothie buah naga berkilau dengan topping biji chia dan irisan pisang',
                    'potongan kue cokelat lumer berselimut saus karamel manis'
                ],
                'lainnya': [
                    'kucing ras British Shorthair berbulu abu-abu lebat duduk dengan anggun',
                    'tanaman hias monstera hijau segar dalam pot keramik putih',
                    'set meja kerja minimalis berisi laptop tipis, buku catatan, dan kopi',
                    'mobil sport klasik warna merah mengkilap terparkir rapi',
                    'buket bunga mawar merah dan baby breath terikat pita satin'
                ]
            };

            const selectedSubjects = subjectsMap[subjectType] || subjectsMap['orang'];
            const activeCategories = CATEGORY_BANK.filter(cat => selectedCategories.includes(cat.id));
            const categoryPool = activeCategories.length > 0 ? activeCategories : CATEGORY_BANK;

            let promptCounter = 1;

            while (results.length < count) {
                const categoryObj = categoryPool[(promptCounter - 1) % categoryPool.length];
                const itemObj = categoryObj.items[(promptCounter - 1) % categoryObj.items.length];
                const subjekText = selectedSubjects[(promptCounter - 1) % selectedSubjects.length];

                // Menyiapkan 5 Unsur Wajib
                let subjekFull = subjekText;
                let poseAction = mode === 'edit' ? 'pertahankan pose dan ekspresi asli subjek' : 'menghadap ke arah kamera dengan sikap alami';
                let latarText = itemObj.background;
                let lightingText = itemObj.lighting;
                let cameraText = itemObj.camera;
                
                if (customMood && customMood.trim() !== '') {
                    lightingText += `, beratap nuansa ${customMood.trim()}`;
                }

                // Menyusun Narasi Lengkap
                let promptNarration = '';
                if (mode === 'edit') {
                    promptNarration = `Ubah latar foto ini: pertahankan wajah, ekspresi, dan pose asli dari subjek (${subjekFull}). Ganti latar belakang menjadi ${latarText}. Sesuaikan pencahayaan subjek dengan ${lightingText}. Render menggunakan ${cameraText}, kualitas ultra-high resolution.`;
                } else {
                    promptNarration = `Foto potret berkualitas tinggi dari ${subjekFull}, ${poseAction}. Latar belakang ${latarText}. Pencahayaan ${lightingText}. Ditembak menggunakan ${cameraText}, fokus tajam pada subjek, kedalaman ruang yang realistis, foto jernih tanpa cacat.`;
                }

                results.push({
                    id: `prompt-${promptCounter}-${Date.now()}`,
                    number: promptCounter,
                    title: `${itemObj.title}`,
                    categoryLetter: categoryObj.id,
                    categoryName: categoryObj.name,
                    prompt: promptNarration,
                    suitableFor: `${purpose} - Konten ${categoryObj.name.toLowerCase()}`
                });

                promptCounter++;
            }

            return results;
        }

            const systemPrompt = `Kamu adalah Creative Director & Prompt Engineer khusus untuk Nano Banana / Gemini Image.
Tugasmu: Hasilnya HARUS berupa JSON ARRAY murni tanpa tag markdown backtick.
Setiap item JSON memuat properti:
- "title": nama gaya/tema singkat
- "categoryLetter": huruf kategori (misal "A", "B", "C")
- "categoryName": nama kategori lengkap
- "prompt": narasi prompt 5 unsur lengkap (Subjek, Pose/Aksi, Latar, Pencahayaan, Gaya Kamera/Render). Jika mode edit, harus ada instruksi "pertahankan wajah, ekspresi, dan pose asli, hanya ubah...".
- "suitableFor": peruntukan konten singkat.`;

            const userQuery = `Buatkan tepat ${count} prompt foto unik untuk:
- Jenis Subjek: ${subjectType}
- Tujuan: ${purpose}
- Kategori pilihan: ${activeCatNames || 'Semua Kategori A-M'}
- Mode: ${mode === 'edit' ? 'EDIT FOTO (Jaga konsistensi wajah/subjek asli)' : 'BUAT FOTO BARU'}
- Mood/Gaya Opsional: ${customMood || 'bebas kreatif'}

Kembalikan ARRAY JSON objek persis sebanyak ${count} item.`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                throw new Error("Gagal menghubungi Gemini AI API. Menggunakan generator lokal fallback.");
            }

            const data = await res.json();
            const rawJsonText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!rawJsonText) {
                throw new Error("Respon Gemini AI kosong.");
            }

            const parsed = JSON.parse(rawJsonText);
            return parsed.map((item, index) => ({
                id: `gemini-prompt-${index + 1}-${Date.now()}`,
                number: index + 1,
                title: item.title || `Prompt Kreatif ${index + 1}`,
                categoryLetter: item.categoryLetter || 'A',
                categoryName: item.categoryName || 'Latar Studio Profesional',
                prompt: item.prompt,
                suitableFor: item.suitableFor || purpose
            }));
        }

        function App() {
            // Form State
            const [subjectType, setSubjectType] = useState('orang');
            const [purpose, setPurpose] = useState('media sosial & portofolio');
            const [selectedCategories, setSelectedCategories] = useState(['A', 'B', 'C', 'D']);
            const [count, setCount] = useState(25);
            const [customMood, setCustomMood] = useState('');
            const [mode, setMode] = useState('new');

            // Output & App State
            const [prompts, setPrompts] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [isAiGenerating, setIsAiGenerating] = useState(false);
            const [activeFilterCategory, setActiveFilterCategory] = useState('ALL');
            const [searchTerm, setSearchTerm] = useState('');
            const [viewMode, setViewMode] = useState('cards');
            const [copiedId, setCopiedId] = useState(null);
            const [favorites, setFavorites] = useState([]);

            // Modal Render Test State
            const [previewModalPrompt, setPreviewModalPrompt] = useState(null);
            const [editablePromptText, setEditablePromptText] = useState('');
            const [selectedModel, setSelectedModel] = useState('gemini-3.1-flash-image-preview');
            const [aspectRatio, setAspectRatio] = useState('1:1');
            const [previewImage, setPreviewImage] = useState(null);
            const [isImageLoading, setIsImageLoading] = useState(false);
            const [imageError, setImageError] = useState(null);
            const [loadingMessage, setLoadingMessage] = useState('');

            // Multi-Turn Interactive Edit State
            const [chatHistory, setChatHistory] = useState([]);
            const [followUpInput, setFollowUpInput] = useState('');

            // Initial Prompt Loading
            useEffect(() => {
                handleGeneratePrompts(false);
            }, []);

            const toggleCategory = (catId) => {
                if (selectedCategories.includes(catId)) {
                    setSelectedCategories(selectedCategories.filter(id => id !== catId));
                } else {
                    setSelectedCategories([...selectedCategories, catId]);
                }
            };

            const selectAllCategories = () => {
                setSelectedCategories(CATEGORY_BANK.map(c => c.id));
            };

            const clearCategories = () => {
                setSelectedCategories([]);
            };

            // Handler Eksekusi Generator
            const handleGeneratePrompts = async (useGemini = false) => {
                setIsLoading(true);
                setIsAiGenerating(useGemini);
                try {
                    if (useGemini) {
                        const result = await fetchGeminiPrompts({
                            subjectType, purpose, selectedCategories, mode, count, customMood
                        });
                        setPrompts(result);
                    } else {
                        const result = generateLocalPrompts({
                            subjectType, purpose, selectedCategories, mode, count, customMood
                        });
                        setPrompts(result);
                    }
                } catch (err) {
                    console.warn("AI Generation fallback executed:", err);
                    const fallback = generateLocalPrompts({
                        subjectType, purpose, selectedCategories, mode, count, customMood
                    });
                    setPrompts(fallback);
                } finally {
                    setIsLoading(false);
                    setIsAiGenerating(false);
                }
            };

            // Copy Handler yang Kompatibel dengan iFrame
            const handleCopy = (text, id) => {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);

                    setCopiedId(id);
                    setTimeout(() => setCopiedId(null), 2000);
                } catch (err) {
                    console.error("Gagal menyalin:", err);
                }
            };

            // Favorite Toggle
            const toggleFavorite = (id) => {
                if (favorites.includes(id)) {
                    setFavorites(favorites.filter(fId => fId !== id));
                } else {
                    setFavorites([...favorites, id]);
                }
            };

            // Filter logic
            const filteredPrompts = useMemo(() => {
                return prompts.filter(p => {
                    const matchesCategory = activeFilterCategory === 'ALL' || 
                                           (activeFilterCategory === 'FAV' ? favorites.includes(p.id) : p.categoryLetter === activeFilterCategory);
                    const matchesSearch = p.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                          p.prompt.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                          p.categoryName.toLowerCase().includes(searchTerm.toLowerCase());
                    return matchesCategory && matchesSearch;
                });
            }, [prompts, activeFilterCategory, searchTerm, favorites]);

            // Render Image API Engine
            const renderImageApi = async ({ promptText, model, ratio, historyPayload = null }) => {
                const apiKey = ""; // Runtime auto-inject
                
                if (model === 'gemini-3.1-flash-image-preview') {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image-preview:generateContent?key=${apiKey}`;
                    
                    let contents = [];
                    if (historyPayload && historyPayload.length > 0) {
                        contents = historyPayload;
                    } else {
                        contents = [{
                            role: 'user',
                            parts: [{ text: promptText }]
                        }];
                    }

                    const payload = {
                        contents: contents,
                        generationConfig: {
                            responseModalities: ['IMAGE'],
                            imageConfig: { aspectRatio: ratio }
                        }
                    };

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        throw new Error(`Gagal memproses via Gemini 3.1 Flash Image (Status: ${res.status}).`);
                    }

                    const data = await res.json();
                    const candidate = data?.candidates?.[0];
                    const part = candidate?.content?.parts?.find(p => p.inlineData);

                    if (part && part.inlineData?.data) {
                        return {
                            imageUrl: `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`,
                            modelTurn: candidate.content
                        };
                    } else {
                        throw new Error("Respon tidak memuat data gambar dari Gemini 3.1.");
                    }
                } else {
                    // Imagen 4.0
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                    const payload = {
                        instances: [{ prompt: promptText }],
                        parameters: { sampleCount: 1 }
                    };

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        throw new Error(`Gagal memproses via Imagen 4.0 (Status: ${res.status}).`);
                    }

                    const data = await res.json();
                    if (data.predictions && data.predictions.length > 0 && data.predictions[0].bytesBase64Encoded) {
                        return {
                            imageUrl: `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`,
                            modelTurn: null
                        };
                    } else {
                        throw new Error("Respon tidak memuat data gambar dari Imagen 4.0.");
                    }
                }
            };

            // Handler Buka / Test Render
            const handleTestPrompt = async (promptObj, overrideText = null, overrideModel = null, overrideRatio = null) => {
                const textToUse = overrideText !== null ? overrideText : (promptObj ? promptObj.prompt : editablePromptText);
                const modelToUse = overrideModel || selectedModel;
                const ratioToUse = overrideRatio || aspectRatio;

                if (promptObj) setPreviewModalPrompt(promptObj);
                setEditablePromptText(textToUse);
                setPreviewImage(null);
                setImageError(null);
                setIsImageLoading(true);
                setChatHistory([]);
                setFollowUpInput('');

                const loadingSteps = [
                    "Mengirim 5 Unsur Wajib ke Nano Banana Engine...",
                    "Menyesuaikan lighting, komposisi, & rasio " + ratioToUse + "...",
                    "Sintesis piksel resolusi tinggi..."
                ];
                let step = 0;
                setLoadingMessage(loadingSteps[0]);
                const timer = setInterval(() => {
                    step = (step + 1) % loadingSteps.length;
                    setLoadingMessage(loadingSteps[step]);
                }, 1600);

                try {
                    const result = await renderImageApi({
                        promptText: textToUse,
                        model: modelToUse,
                        ratio: ratioToUse
                    });
                    setPreviewImage(result.imageUrl);
                    if (result.modelTurn) {
                        setChatHistory([
                            { role: 'user', parts: [{ text: textToUse }] },
                            result.modelTurn
                        ]);
                    }
                } catch (err) {
                    console.error("Image render error:", err);
                    setImageError(err.message || "Gagal merender gambar sampel.");
                } finally {
                    clearInterval(timer);
                    setIsImageLoading(false);
                }
            };

            // Multi-turn Edit Handler
            const handleFollowUpEdit = async () => {
                if (!followUpInput.trim() || isImageLoading) return;
                const editInstruction = followUpInput.trim();
                setFollowUpInput('');
                setIsImageLoading(true);
                setImageError(null);
                setLoadingMessage("Nano Banana sedang menerapkan instruksi edit Anda...");

                const nextHistory = [
                    ...chatHistory,
                    { role: 'user', parts: [{ text: editInstruction }] }
                ];

                try {
                    const result = await renderImageApi({
                        promptText: editInstruction,
                        model: 'gemini-3.1-flash-image-preview',
                        ratio: aspectRatio,
                        historyPayload: nextHistory
                    });
                    setPreviewImage(result.imageUrl);
                    if (result.modelTurn) {
                        setChatHistory([
                            ...nextHistory,
                            result.modelTurn
                        ]);
                    }
                } catch (err) {
                    console.error("Multi-turn edit error:", err);
                    setImageError(err.message || "Gagal menerapkan instruksi edit lanjutan.");
                } finally {
                    setIsImageLoading(false);
                }
            };

            // Export ke File TXT
            const exportToText = () => {
                let content = `NANO BANANA PROMPT STUDIO - DAFTAR PROMPT (${prompts.length} IDE)\n`;
                content += `Jenis Foto: ${subjectType} | Tujuan: ${purpose} | Mode: ${mode}\n`;
                content += `=`.repeat(60) + `\n\n`;

                prompts.forEach((p, i) => {
                    content += `${i + 1}. ${p.title} — (${p.categoryName})\n`;
                    content += `Prompt: "${p.prompt}"\n`;
                    content += `Cocok untuk: ${p.suitableFor}\n\n`;
                });

                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Nano_Banana_Prompts_${Date.now()}.txt`;
                a.click();
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-slate-900/90 border-b border-slate-800 backdrop-blur-md sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-banana-500 to-amber-300 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-banana-500/20">
                                    <Icon name="sparkles" className="w-6 h-6" />
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold text-white tracking-tight flex items-center gap-2">
                                        Prompt Generator <span className="text-banana-400 font-extrabold text-xs uppercase px-2 py-0.5 rounded-full bg-banana-500/10 border border-banana-500/30">Saiyudi Tools</span>
                                    </h1>
                                    <p className="text-xs text-slate-400">Generator Khusus Foto AI (Gemini Image)</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={exportToText}
                                    disabled={prompts.length === 0}
                                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 flex items-center gap-1.5 transition-all"
                                >
                                    <Icon name="download" className="w-4 h-4 text-banana-400" />
                                    Ekspor TXT ({prompts.length})
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* LEFT PANEL: FORM PARAMETER (5 Pertanyaan Wajib) */}
                        <div className="lg:col-span-4 space-y-5">
                            <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-xl">
                                <div className="border-b border-slate-800 pb-3 flex items-center justify-between">
                                    <h2 className="text-sm font-bold text-white flex items-center gap-2">
                                        <Icon name="wand2" className="w-4 h-4 text-banana-400" />
                                        Parameter Prompt
                                    </h2>
                                    <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">5 Pertanyaan</span>
                                </div>

                                {/* 1. Jenis Foto Dasar */}
                                <div>
                                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">1. Jenis Foto Dasar Subjek</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {[
                                            { id: 'orang', label: 'Orang / Potret' },
                                            { id: 'produk', label: 'Produk' },
                                            { id: 'makanan', label: 'Kuliner / Food' },
                                            { id: 'lainnya', label: 'Lainnya / Hewan' }
                                        ].map(t => (
                                            <button
                                                key={t.id}
                                                onClick={() => setSubjectType(t.id)}
                                                className={`py-2 px-3 rounded-xl text-xs font-medium border text-left transition-all ${
                                                    subjectType === t.id
                                                        ? 'bg-banana-500/10 border-banana-400 text-banana-400 font-bold'
                                                        : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                                                }`}
                                            >
                                                {t.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Mode Aksi */}
                                <div>
                                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Mode Operasi Nano Banana</label>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setMode('new')}
                                            className={`flex-1 py-1.5 px-3 rounded-xl text-xs font-semibold border transition-all ${
                                                mode === 'new'
                                                    ? 'bg-banana-500 text-slate-950 border-banana-400 font-bold'
                                                    : 'bg-slate-950 border-slate-800 text-slate-400'
                                            }`}
                                        >
                                            Buat Foto Baru
                                        </button>
                                        <button
                                            onClick={() => setMode('edit')}
                                            className={`flex-1 py-1.5 px-3 rounded-xl text-xs font-semibold border transition-all ${
                                                mode === 'edit'
                                                    ? 'bg-banana-500 text-slate-950 border-banana-400 font-bold'
                                                    : 'bg-slate-950 border-slate-800 text-slate-400'
                                            }`}
                                        >
                                            Edit Foto Asli
                                        </button>
                                    </div>
                                    {mode === 'edit' && (
                                        <p className="text-[10px] text-banana-400/90 mt-1 italic">
                                            *Otomatis menambahkan instruksi wajib: "pertahankan wajah, ekspresi, dan pose asli...".
                                        </p>
                                    )}
                                </div>

                                {/* 2. Tujuan Penggunaan */}
                                <div>
                                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">2. Tujuan Penggunaan</label>
                                    <input
                                        type="text"
                                        value={purpose}
                                        onChange={(e) => setPurpose(e.target.value)}
                                        placeholder="Misal: media sosial, katalog toko, portofolio..."
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-banana-400"
                                    />
                                </div>

                                {/* 3. Kategori yang Diinginkan */}
                                <div>
                                    <div className="flex justify-between items-center mb-1.5">
                                        <label className="text-xs font-semibold text-slate-300">3. Bank Kategori Pilihan (A-M)</label>
                                        <div className="flex gap-2 text-[10px]">
                                            <button onClick={selectAllCategories} className="text-banana-400 hover:underline">Pilih Semua</button>
                                            <span className="text-slate-600">|</span>
                                            <button onClick={clearCategories} className="text-slate-400 hover:underline">Bersihkan</button>
                                        </div>
                                    </div>
                                    <div className="max-h-48 overflow-y-auto space-y-1 pr-1 bg-slate-950 p-2 rounded-xl border border-slate-800/80">
                                        {CATEGORY_BANK.map(cat => (
                                            <label
                                                key={cat.id}
                                                className={`flex items-center gap-2 p-1.5 rounded-lg text-xs cursor-pointer select-none transition-colors ${
                                                    selectedCategories.includes(cat.id)
                                                        ? 'bg-slate-900 text-banana-300 font-medium'
                                                        : 'text-slate-400 hover:text-slate-200'
                                                }`}
                                            >
                                                <input
                                                    type="checkbox"
                                                    checked={selectedCategories.includes(cat.id)}
                                                    onChange={() => toggleCategory(cat.id)}
                                                    className="accent-banana-500 rounded"
                                                />
                                                <span className="font-bold text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-300">{cat.id}</span>
                                                <span className="truncate">{cat.name}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>

                                {/* 4. Jumlah Variasi */}
                                <div>
                                    <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1.5">
                                        <span>4. Jumlah Variasi Prompt</span>
                                        <span className="text-banana-400 font-bold">{count} Prompt</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <input
                                            type="range"
                                            min="5"
                                            max="100"
                                            step="5"
                                            value={count}
                                            onChange={(e) => setCount(parseInt(e.target.value))}
                                            className="flex-1 accent-banana-400 bg-slate-950 rounded-lg cursor-pointer h-2"
                                        />
                                    </div>
                                </div>

                                {/* 5. Mood / Warna Favorit */}
                                <div>
                                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">5. Gaya / Mood / Warna (Opsional)</label>
                                    <input
                                        type="text"
                                        value={customMood}
                                        onChange={(e) => setCustomMood(e.target.value)}
                                        placeholder="Misal: cinematic warm golden, moody dark, pastel dreamy..."
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-banana-400"
                                    />
                                </div>

                                {/* Action Buttons */}
                                <div className="pt-2 space-y-2">
                                    <button
                                        onClick={() => handleGeneratePrompts(false)}
                                        disabled={isLoading}
                                        className="w-full py-2.5 bg-banana-500 hover:bg-banana-400 text-slate-950 font-bold rounded-2xl text-xs transition-all shadow-lg shadow-banana-500/20 flex items-center justify-center gap-2"
                                    >
                                        <Icon name="sparkles" className="w-4 h-4" />
                                        ⚡ Hasilkan Prompt Instan ({count})
                                    </button>

                                    <button
                                        onClick={() => handleGeneratePrompts(true)}
                                        disabled={isLoading}
                                        className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-banana-300 font-bold rounded-2xl text-xs border border-banana-500/30 transition-all flex items-center justify-center gap-2"
                                    >
                                        <Icon name="wand2" className="w-4 h-4 text-banana-400" />
                                        ✨ Generasi Kreatif via Gemini AI
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* RIGHT PANEL: PROMPT OUTPUT LIST & FILTER */}
                        <div className="lg:col-span-8 space-y-4">
                            {/* Controls & Search Bar */}
                            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 flex flex-wrap items-center justify-between gap-3 shadow-md">
                                <div className="flex items-center gap-2 flex-1 min-w-[200px]">
                                    <Icon name="search" className="w-4 h-4 text-slate-400" />
                                    <input
                                        type="text"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        placeholder="Cari kata kunci, subjek, atau latar..."
                                        className="bg-transparent text-xs text-slate-200 focus:outline-none w-full"
                                    />
                                </div>

                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => setViewMode('cards')}
                                        className={`p-2 rounded-xl text-xs border transition-all ${
                                            viewMode === 'cards' ? 'bg-banana-500/20 border-banana-400 text-banana-400' : 'bg-slate-950 border-slate-800 text-slate-400'
                                        }`}
                                        title="Tampilan Kartu"
                                    >
                                        <Icon name="grid" className="w-4 h-4" />
                                    </button>
                                    <button
                                        onClick={() => setViewMode('table')}
                                        className={`p-2 rounded-xl text-xs border transition-all ${
                                            viewMode === 'table' ? 'bg-banana-500/20 border-banana-400 text-banana-400' : 'bg-slate-950 border-slate-800 text-slate-400'
                                        }`}
                                        title="Tampilan Tabel Ringkas"
                                    >
                                        <Icon name="list" className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>

                            {/* Filter Kategori Horizontal */}
                            <div className="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                                <button
                                    onClick={() => setActiveFilterCategory('ALL')}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                                        activeFilterCategory === 'ALL'
                                            ? 'bg-banana-500 text-slate-950 font-bold'
                                            : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                                    }`}
                                >
                                    Semua ({prompts.length})
                                </button>
                                <button
                                    onClick={() => setActiveFilterCategory('FAV')}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-1 ${
                                        activeFilterCategory === 'FAV'
                                            ? 'bg-rose-500 text-white font-bold'
                                            : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                                    }`}
                                >
                                    <Icon name="heart" className="w-3.5 h-3.5 fill-current" />
                                    Favorit ({favorites.length})
                                </button>
                                {CATEGORY_BANK.map(cat => (
                                    <button
                                        key={cat.id}
                                        onClick={() => setActiveFilterCategory(cat.id)}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                                            activeFilterCategory === cat.id
                                                ? 'bg-banana-500 text-slate-950 font-bold'
                                                : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                                        }`}
                                    >
                                        {cat.id}. {cat.name.split(' ')[0]}
                                    </button>
                                ))}
                            </div>

                            {/* Content Output List */}
                            {isLoading ? (
                                <div className="bg-slate-900/50 border border-slate-800 rounded-3xl p-12 text-center space-y-4">
                                    <div className="w-12 h-12 border-4 border-banana-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                    <p className="text-sm font-medium text-slate-300 animate-pulse">
                                        {isAiGenerating ? 'Meminta Gemini AI merancang prompt 5 unsur...' : 'Menyusun variasi prompt Nano Banana...'}
                                    </p>
                                </div>
                            ) : filteredPrompts.length === 0 ? (
                                <div className="bg-slate-900/50 border border-slate-800 rounded-3xl p-12 text-center space-y-2">
                                    <Icon name="search" className="w-8 h-8 text-slate-600 mx-auto" />
                                    <p className="text-sm font-medium text-slate-400">Tidak ada prompt yang sesuai dengan kriteria filter.</p>
                                </div>
                            ) : viewMode === 'cards' ? (
                                <div className="space-y-3.5">
                                    {filteredPrompts.map((p, idx) => (
                                        <div
                                            key={p.id}
                                            className="bg-slate-900/90 border border-slate-800 hover:border-slate-700 rounded-2xl p-4 transition-all space-y-3 relative group"
                                        >
                                            <div className="flex items-start justify-between gap-3">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-xs font-extrabold text-banana-400 bg-banana-500/10 px-2.5 py-1 rounded-lg border border-banana-500/20">
                                                        #{idx + 1}
                                                    </span>
                                                    <h3 className="text-sm font-bold text-white">{p.title}</h3>
                                                    <span className="text-[10px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded-md border border-slate-700">
                                                        {p.categoryName}
                                                    </span>
                                                </div>

                                                <div className="flex items-center gap-1">
                                                    <button
                                                        onClick={() => toggleFavorite(p.id)}
                                                        className={`p-1.5 rounded-lg transition-colors ${
                                                            favorites.includes(p.id) ? 'text-rose-500 fill-rose-500' : 'text-slate-500 hover:text-slate-300'
                                                        }`}
                                                        title="Simpan Favorit"
                                                    >
                                                        <Icon name="heart" className="w-4 h-4" />
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Text Prompt Area */}
                                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80 font-mono text-xs text-slate-200 leading-relaxed select-all">
                                                <span className="text-banana-400/80 font-bold select-none">Prompt: </span>
                                                "{p.prompt}"
                                            </div>

                                            <div className="flex items-center justify-between pt-1 text-[11px] text-slate-400">
                                                <span><strong className="text-slate-300">Cocok untuk:</strong> {p.suitableFor}</span>
                                                
                                                <div className="flex items-center gap-2">
                                                    <button
                                                        onClick={() => handleTestPrompt(p)}
                                                        className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-banana-400 font-semibold rounded-xl border border-banana-500/30 flex items-center gap-1 transition-all"
                                                    >
                                                        <Icon name="play" className="w-3.5 h-3.5" />
                                                        Tes Render
                                                    </button>

                                                    <button
                                                        onClick={() => handleCopy(p.prompt, p.id)}
                                                        className={`px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 transition-all ${
                                                            copiedId === p.id
                                                                ? 'bg-emerald-500 text-slate-950'
                                                                : 'bg-banana-500 hover:bg-banana-400 text-slate-950'
                                                        }`}
                                                    >
                                                        <Icon name={copiedId === p.id ? 'check' : 'copy'} className="w-3.5 h-3.5" />
                                                        {copiedId === p.id ? 'Tersalin!' : 'Salin Prompt'}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                /* Table View */
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse text-xs">
                                            <thead>
                                                <tr className="bg-slate-950 text-slate-400 border-b border-slate-800">
                                                    <th className="p-3">#</th>
                                                    <th className="p-3">Gaya & Kategori</th>
                                                    <th className="p-3">Kalimat Prompt (Siap Tempel)</th>
                                                    <th className="p-3 text-right">Aksi</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800/60">
                                                {filteredPrompts.map((p, idx) => (
                                                    <tr key={p.id} className="hover:bg-slate-800/40 transition-colors">
                                                        <td className="p-3 font-bold text-banana-400">{idx + 1}</td>
                                                        <td className="p-3 font-semibold text-white whitespace-nowrap">
                                                            <div>{p.title}</div>
                                                            <div className="text-[10px] text-slate-500">{p.categoryName}</div>
                                                        </td>
                                                        <td className="p-3 font-mono text-slate-300 max-w-md truncate">
                                                            "{p.prompt}"
                                                        </td>
                                                        <td className="p-3 text-right whitespace-nowrap">
                                                            <div className="flex justify-end gap-1.5">
                                                                <button
                                                                    onClick={() => handleTestPrompt(p)}
                                                                    className="p-1.5 bg-slate-800 text-banana-400 rounded-lg border border-slate-700"
                                                                    title="Tes Render"
                                                                >
                                                                    <Icon name="play" className="w-3.5 h-3.5" />
                                                                </button>
                                                                <button
                                                                    onClick={() => handleCopy(p.prompt, p.id)}
                                                                    className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${
                                                                        copiedId === p.id ? 'bg-emerald-500 text-slate-950' : 'bg-banana-500 text-slate-950'
                                                                    }`}
                                                                >
                                                                    {copiedId === p.id ? 'Tersalin' : 'Salin'}
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {previewModalPrompt && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md overflow-y-auto">
                            <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-2xl w-full p-6 space-y-5 shadow-2xl relative my-auto">
                                <button
                                    onClick={() => setPreviewModalPrompt(null)}
                                    className="absolute right-4 top-4 text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-800 transition-all z-10"
                                >
                                    <Icon name="x" className="w-5 h-5" />
                                </button>

                                <div className="flex items-center gap-2">
                                    <div className="p-2 bg-banana-500/20 text-banana-400 rounded-xl">
                                        <Icon name="sparkles" className="w-5 h-5" />
                                    </div>
                                    <div>
                                        <span className="text-[11px] text-banana-400 font-bold uppercase tracking-wider">Studio Tes Render Interactive</span>
                                        <h3 className="text-base font-bold text-white">{previewModalPrompt.title}</h3>
                                    </div>
                                </div>

                                {/* Controls: Model & Aspect Ratio */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 bg-slate-950 p-3.5 rounded-2xl border border-slate-800">
                                    <div>
                                        <label className="block text-[11px] font-semibold text-slate-400 mb-1">Model AI Generator</label>
                                        <select
                                            value={selectedModel}
                                            onChange={(e) => {
                                                setSelectedModel(e.target.value);
                                                handleTestPrompt(null, editablePromptText, e.target.value, aspectRatio);
                                            }}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-banana-400"
                                        >
                                            <option value="gemini-3.1-flash-image-preview">Gemini 3.1 Flash Image (Multi-Turn Edit)</option>
                                            <option value="imagen-4.0-generate-001">Imagen 4.0 (Ultra High Detail)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-semibold text-slate-400 mb-1">Rasio Aspek Gambar</label>
                                        <div className="flex gap-1.5">
                                            {['1:1', '16:9', '9:16', '4:3', '3:4'].map((ratio) => (
                                                <button
                                                    key={ratio}
                                                    onClick={() => {
                                                        setAspectRatio(ratio);
                                                        handleTestPrompt(null, editablePromptText, selectedModel, ratio);
                                                    }}
                                                    className={`flex-1 py-1 px-2 rounded-lg text-[11px] font-semibold border transition-all ${
                                                        aspectRatio === ratio
                                                            ? 'bg-banana-500 text-slate-950 border-banana-400 font-bold'
                                                            : 'bg-slate-900 text-slate-400 border-slate-700 hover:border-slate-500'
                                                    }`}
                                                >
                                                    {ratio}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Editable Text Prompt Area */}
                                <div className="space-y-1.5">
                                    <div className="flex justify-between items-center text-[11px]">
                                        <label className="font-semibold text-slate-300">Teks Prompt (Dapat Diedit):</label>
                                        <button
                                            onClick={() => handleCopy(editablePromptText, 'modal-copy')}
                                            className="text-banana-400 hover:underline flex items-center gap-1"
                                        >
                                            <Icon name="copy" className="w-3 h-3" />
                                            {copiedId === 'modal-copy' ? 'Tersalin!' : 'Salin Prompt'}
                                        </button>
                                    </div>
                                    <textarea
                                        rows="3"
                                        value={editablePromptText}
                                        onChange={(e) => setEditablePromptText(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 font-mono focus:outline-none focus:border-banana-400"
                                    />
                                    <button
                                        onClick={() => handleTestPrompt(null, editablePromptText, selectedModel, aspectRatio)}
                                        disabled={isImageLoading}
                                        className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-banana-400 border border-banana-500/30 rounded-xl text-xs font-semibold transition-all flex items-center justify-center gap-2"
                                    >
                                        <Icon name="refresh-cw" className={`w-3.5 h-3.5 ${isImageLoading ? 'animate-spin' : ''}`} />
                                        Render Ulang dengan Prompt Terubah
                                    </button>
                                </div>

                                {/* Dynamic Image Canvas Preview */}
                                <div className={`relative w-full bg-slate-950 border border-slate-800 rounded-2xl flex items-center justify-center overflow-hidden transition-all min-h-[280px] ${
                                    aspectRatio === '16:9' ? 'aspect-video' : aspectRatio === '9:16' ? 'aspect-[9/16] max-h-[420px] mx-auto' : 'aspect-square max-h-[350px] mx-auto'
                                }`}>
                                    {isImageLoading ? (
                                        <div className="text-center space-y-3 p-6 max-w-sm">
                                            <div className="w-10 h-10 border-4 border-banana-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                            <p className="text-xs text-slate-300 font-medium animate-pulse">{loadingMessage}</p>
                                        </div>
                                    ) : imageError ? (
                                        <div className="text-center space-y-3 p-6 max-w-md">
                                            <Icon name="alert-triangle" className="w-8 h-8 text-rose-400 mx-auto" />
                                            <p className="text-xs text-rose-300">{imageError}</p>
                                            <button
                                                onClick={() => handleTestPrompt(null, editablePromptText, selectedModel, aspectRatio)}
                                                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs text-white rounded-xl font-medium"
                                            >
                                                Coba Ulang
                                            </button>
                                        </div>
                                    ) : previewImage ? (
                                        <div className="relative w-full h-full group">
                                            <img
                                                src={previewImage}
                                                alt={previewModalPrompt.title}
                                                className="w-full h-full object-contain bg-black/40"
                                            />
                                        </div>
                                    ) : null}
                                </div>

                                {/* Multi-Turn Editing (Gemini 3.1 Only) */}
                                {selectedModel === 'gemini-3.1-flash-image-preview' && previewImage && !isImageLoading && (
                                    <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-2">
                                        <label className="block text-[11px] font-semibold text-banana-400 flex items-center gap-1.5">
                                            <Icon name="message-square" className="w-3.5 h-3.5" />
                                            Edit Latar / Elemen Tambahan (Multi-Turn Nano Banana):
                                        </label>
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                value={followUpInput}
                                                onChange={(e) => setFollowUpInput(e.target.value)}
                                                onKeyDown={(e) => e.key === 'Enter' && handleFollowUpEdit()}
                                                placeholder="Misal: 'Tambahkan kacamata hitam' atau 'Ubah latar jadi pantai malam'..."
                                                className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-banana-400"
                                            />
                                            <button
                                                onClick={handleFollowUpEdit}
                                                className="px-4 py-2 bg-banana-500 hover:bg-banana-400 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-1 shrink-0"
                                            >
                                                <Icon name="send" className="w-3.5 h-3.5" />
                                                Edit
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
